name: OpenIndiana Debugging Workflow via Tailscale
on: [ workflow_dispatch ]   # Workflow is triggered manually

jobs:
  # #########################################################################
  # #### OpenIndiana Debugging Workflow via Tailscale                    ####
  # #########################################################################
  tailscale-debug-openindiana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ###### Connect Host Runner to Tailscale #############################
      - name: Connect Host Runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: ${{ github.event.repository.name }}-openindiana

      # ###### Bridge Tailscale Port 22 to OpenIndiana VM (Port 10022) ######
      - name: Setup Host SSH Relay to Guest VM
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y socat

          # Stop and disable systemd socket activation for SSH on Ubuntu 24.04
          sudo systemctl stop ssh.socket ssh.service || true
          sudo systemctl disable ssh.socket ssh.service || true

          # Wait up to 10 seconds for port 22 to be freed
          for i in $(seq 1 10); do
             if ! sudo ss -tulpn | grep -q ":22 "; then
                break
             fi
             sleep 1
          done

          # Pass Tailscale IPs into GitHub Environment for the VM step
          TS_IP4=$(tailscale ip -4)
          TS_IP6=$(tailscale ip -6 2>/dev/null || true)
          echo "TAILSCALE_IP4=${TS_IP4}" >> "$GITHUB_ENV"
          echo "TAILSCALE_IP6=${TS_IP6}" >> "$GITHUB_ENV"

      # ###### Start OpenIndiana VM and Execute Debug Environment ###########
      - name: Start OpenIndiana VM and Execute Debug Environment
        uses: vmactions/openindiana-vm@v1
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          REPO_NAME: ${{ github.event.repository.name }}
          TAILSCALE_IP4: ${{ env.TAILSCALE_IP4 }}
          TAILSCALE_IP6: ${{ env.TAILSCALE_IP6 }}
        with:
          envs: "GITHUB_ACTOR REPO_NAME TAILSCALE_IP4 TAILSCALE_IP6"
          nat: |
            "2222": "22"
          prepare: |
            pkg refresh --full
            pkg install --accept \
               shell/bash \
               web/curl \
               developer/versioning/git \
               security/sudo

          run: |
            set -eu

            # 1. Create 'runner' user:
            if ! id runner >/dev/null 2>&1; then
               if [ -d /home/runner ]; then
                  useradd -d /home/runner -s /usr/bin/bash -g staff runner
               else
                  useradd -m -d /home/runner -s /usr/bin/bash -g staff runner
               fi
               echo "runner ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers
            fi

            # 2. Setup SSH keys for the GitHub user:
            echo "Fetching SSH public keys for GitHub user: ${GITHUB_ACTOR}..."
            mkdir -p /home/runner/.ssh
            curl -sL "https://github.com/${GITHUB_ACTOR}.keys" >> /home/runner/.ssh/authorized_keys
            chmod 700 /home/runner/.ssh
            chmod 600 /home/runner/.ssh/authorized_keys
            chown -R runner:staff /home/runner

            # 3. Enable and restart SSH service (illumos SMF):
            svcadm restart svc:/network/ssh:default || true
            echo "====== Access at $(date +"%Y-%m-%d %H:%M:%S %z") ================================"
            echo "Tailscale IPs: ${TAILSCALE_IP4} ${TAILSCALE_IP6}"
            echo "Connect via SSH using:"
            echo " * ssh runner@${TAILSCALE_IP4}"
            if [ -n "${TAILSCALE_IP6}" ]; then
               echo " * ssh runner@${TAILSCALE_IP6}"
            fi
            echo " * ssh -p 2222 runner@${TAILSCALE_IP4}"
            echo "SSH key fingerprints:"
            keyNumber=1
            for key in $(find /etc/ssh /usr/local/etc/ssh -maxdepth 1 -name "ssh_host_*.pub" 2>/dev/null | sort) ; do
              echo -n " * #${keyNumber}: "
              ssh-keygen -lf "${key}" | sed -e "s/^\([0-9]*\) \([^ ]*\) \(.*\) (\(.*\))$/\2 (\4 \1)/g"
              keyNumber=$((keyNumber+1))
            done
            echo "==========================================================================="

            # 4. Clone repositories
            mkdir -p /home/runner/src
            chown -R runner:staff /home/runner/src
            cd /home/runner/src
            sudo -u runner git clone https://dreibh@github.com/dreibh/bibtexconv
            sudo -u runner git clone https://dreibh@github.com/simula/dynmhs
            sudo -u runner git clone https://dreibh@github.com/dreibh/fractgen
            sudo -u runner git clone https://dreibh@github.com/dreibh/hipercontracer
            sudo -u runner git clone https://dreibh@github.com/dreibh/netperfmeter
            sudo -u runner git clone https://dreibh@github.com/dreibh/rserpooldemo
            sudo -u runner git clone https://dreibh@github.com/dreibh/rsplib
            sudo -u runner git clone https://dreibh@github.com/dreibh/rtpaudio
            sudo -u runner git clone https://dreibh@github.com/dreibh/sctplib
            sudo -u runner git clone https://dreibh@github.com/dreibh/slideshow
            sudo -u runner git clone https://dreibh@github.com/dreibh/socketapi
            sudo -u runner git clone https://dreibh@github.com/dreibh/subnetcalc
            sudo -u runner git clone https://dreibh@github.com/dreibh/system-tools
            sudo -u runner git clone https://dreibh@github.com/dreibh/tsctp
            sudo -u runner git clone https://dreibh@github.com/simula/nornet-vmimage-builder-scripts.git vmimage-builder-scripts

            # 5. Install System-Tools & Environment Settings:
            pkg install --accept \
               developer/build/cmake \
               developer/build/gnu-make \
               developer/gcc-14 \
               text/gnu-gettext \
               editor/joe \
               web/wget

            cd /home/runner/src/system-tools
            # sudo -u runner ./autogen.sh
            # gmake install

            mkdir -p /etc/system-info.d/
            cp /home/runner/src/vmimage-builder-scripts/files/11-system-info.files/01-hostname \
               /home/runner/src/vmimage-builder-scripts/files/80-simulamet.files/02-simulamet \
               /etc/system-info.d/ || true

            sudo -u runner bash -c "cat >>/home/runner/.bash_profile <<'INNER_EOF'
            [ -f \$HOME/.bashrc ] && source \$HOME/.bashrc
            INNER_EOF"

            sudo -u runner bash -c "cat >>/home/runner/.bashrc <<'INNER_EOF'
            [[ -r \"/usr/share/bash-completion/bash_completion\" ]] && . \"/usr/share/bash-completion/bash_completion\"
            INNER_EOF"
            sudo -u runner bash -c "cat /home/runner/src/vmimage-builder-scripts/files/05-user-settings.files/bashrc >>/home/runner/.bashrc"

            cat >>/etc/profile <<'EOF'
            export LANG="C.UTF-8"
            export LC_CTYPE="C.UTF-8"
            for dir in /etc/profile.d /usr/local/etc/profile.d ; do
                if [ -d "$dir" ]; then
                    for script in "$dir"/*.sh; do
                        [ -r "$script" ] && . "$script"
                    done
                fi
            done
            EOF

            # 6. Set a useful hostname:
            Reset-Machine-ID --yes-to-all-i-am-really-sure -MSK -H "openindiana.github.test" || true

            # 7. Pause and keep alive for interactive SSH debugging:
            while true ; do
               echo "====== Access at $(date +"%Y-%m-%d %H:%M:%S %z") ================================"
               echo "Tailscale IPs: ${TAILSCALE_IP4} ${TAILSCALE_IP6}"
               echo "Connect via SSH using:"
               echo " * ssh runner@${TAILSCALE_IP4}"
               if [ -n "${TAILSCALE_IP6}" ]; then
                  echo " * ssh runner@${TAILSCALE_IP6}"
               fi
               echo " * ssh -p 2222 runner@${TAILSCALE_IP4}"
               echo "SSH key fingerprints:"
               keyNumber=1
               for key in $(find /etc/ssh /usr/local/etc/ssh -maxdepth 1 -name "ssh_host_*.pub" 2>/dev/null | sort) ; do
                 echo -n " * #${keyNumber}: "
                 ssh-keygen -lf "${key}" | sed -e "s/^\([0-9]*\) \([^ ]*\) \(.*\) (\(.*\))$/\2 (\4 \1)/g"
                 keyNumber=$((keyNumber+1))
               done
               echo "==========================================================================="
               sleep 300
            done
