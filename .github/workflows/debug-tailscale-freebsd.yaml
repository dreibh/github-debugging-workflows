name: FreeBSD 15.1 Debugging Workflow via Tailscale
on: [ workflow_dispatch ]   # Workflow is triggered manually

jobs:
  # #########################################################################
  # #### FreeBSD Debugging Workflow via Tailscale                        ####
  # #########################################################################
  tailscale-debug-freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ###### Boot FreeBSD 15.1 VM & Execute Debug Environment #############
      - name: Start FreeBSD 15.1 VM & Debugging Environment
        uses: vmactions/freebsd-vm@v1
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          GITHUB_ACTOR: ${{ github.actor }}
          REPO_NAME: ${{ github.event.repository.name }}
        with:
          release: "15.1"
          envs: "TAILSCALE_AUTHKEY GITHUB_ACTOR REPO_NAME"
          prepare: |
            pkg update
            pkg install -y bash curl git sudo tailscale openssh-portable

          run: |
            set -euo pipefail

            # 1. Start Tailscale daemon and connect inside FreeBSD
            sysrc tailscaled_enable="YES"
            service tailscaled start

            TS_HOSTNAME="${REPO_NAME}-freebsd"
            tailscale up --authkey="${TAILSCALE_AUTHKEY}" --hostname="${TS_HOSTNAME}"

            # 2. Create 'runner' user
            if ! pw user show runner >/dev/null 2>&1; then
               pw useradd runner -m -s /usr/local/bin/bash -g wheel
               echo "runner ALL=(ALL) NOPASSWD:ALL" >> /usr/local/etc/sudoers
            fi

            # 3. Setup SSH keys for the GitHub user
            echo "Fetching SSH public keys for GitHub user: ${GITHUB_ACTOR}..."
            mkdir -p /home/runner/.ssh
            curl -sL "https://github.com/${GITHUB_ACTOR}.keys" >> /home/runner/.ssh/authorized_keys
            chmod 700 /home/runner/.ssh
            chmod 600 /home/runner/.ssh/authorized_keys
            chown -R runner:wheel /home/runner

            # Enable and start SSH service
            sysrc sshd_enable="YES"
            service sshd restart || /usr/sbin/sshd

            # 4. Clone repositories
            mkdir -p /home/runner/src
            chown -R runner:wheel /home/runner/src
            cd /home/runner/src
            sudo -u runner git clone https://dreibh@github.com/dreibh/bibtexconv
            sudo -u runner git clone https://dreibh@github.com/simula/dynmhs
            sudo -u runner git clone https://dreibh@github.com/dreibh/fractgen
            sudo -u runner git clone https://dreibh@github.com/dreibh/hipercontracer
            sudo -u runner git clone https://dreibh@github.com/dreibh/netperfmeter
            sudo -u runner git clone https://dreibh@github.com/dreibh/rserpooldemo
            sudo -u runner git clone https://dreibh@github.com/dreibh/rsplib
            sudo -u runner git clone https://dreibh@github.com/dreibh/rtpaudio
            sudo -u runner git clone https://dreibh@github.com/dreibh/sctplib
            sudo -u runner git clone https://dreibh@github.com/dreibh/slideshow
            sudo -u runner git clone https://dreibh@github.com/dreibh/socketapi
            sudo -u runner git clone https://dreibh@github.com/dreibh/subnetcalc
            sudo -u runner git clone https://dreibh@github.com/dreibh/system-tools
            sudo -u runner git clone https://dreibh@github.com/dreibh/tsctp
            sudo -u runner git clone https://dreibh@github.com/simula/nornet-vmimage-builder-scripts.git vmimage-builder-scripts

            # 5. Pre-install FreeBSD packages
            pkg install -y libidn2 libmaxminddb

            pkg install -y ghostscript10 GraphicsMagick pdf2svg

            pkg install -y bison flex curl openssl

            pkg install -y boost-libs zstd

            pkg install -y qt6-base qt6-tools

            pkg install -y gimp3-app p5-Image-ExifTool
            pkg install -y noto

            pkg install -y gnutls nss

            pkg install -y autoconf automake glib libtool pkgconf

            pkg install -y pulseaudio

            pkg install -y openssl jansson ldns libuv

            pkg install -y python314

            sudo -u runner bash -c '
              python3 -m venv /home/runner/venv
              . /home/runner/venv/bin/activate
              pip install distro psutil
            '

            # 6. Install System-Tools & Environment Settings
            cd /home/runner/src/system-tools
            sudo -u runner ./autogen.sh
            make install

            mkdir -p /usr/local/etc/system-info.d/
            cp /home/runner/src/vmimage-builder-scripts/files/11-system-info.files/01-hostname \
               /home/runner/src/vmimage-builder-scripts/files/80-simulamet.files/02-simulamet \
               /usr/local/etc/system-info.d/ || true

            sudo -u runner bash -c "cat >>/home/runner/.bash_profile <<'INNER_EOF'
            [ -f \$HOME/.bashrc ] && source \$HOME/.bashrc
            INNER_EOF"

            sudo -u runner bash -c "cat >>/home/runner/.bashrc <<'INNER_EOF'
            [[ -r \"/usr/local/share/bash-completion/bash_completion\" ]] && . \"/usr/local/share/bash-completion/bash_completion\"
            INNER_EOF"
            sudo -u runner bash -c "cat /home/runner/src/vmimage-builder-scripts/files/05-user-settings.files/bashrc >>/home/runner/.bashrc"

            # Set hostname
            hostname "freebsd.github.test"

            # 7. Pause and keep alive for interactive SSH debugging
            while true ; do
               echo "====== Access at $(date +"%Y-%m-%d %H:%M:%S %z") ================================"
               echo "Tailscale IPs: $(tailscale ip | xargs)"
               echo "Connect via SSH using:"
               echo " * ssh runner@$(tailscale ip -4)"
               echo " * ssh runner@$(tailscale ip -6)"
               echo "SSH key fingerprints:"
               keyNumber=1
               while IFS= read -r key ; do
                 echo -n " * #${keyNumber}: "
                 ssh-keygen -lf "${key}" | sed -e "s/^\([0-9]*\) \([^ ]*\) \(.*\) (\(.*\))$/\2 (\4 \1)/g"
                 keyNumber=$((keyNumber+1))
               done < <(find /etc/ssh /usr/local/etc/ssh -maxdepth 1 -name "ssh_host_*.pub" 2>/dev/null | sort)
               echo "==========================================================================="
               sleep 300
            done
