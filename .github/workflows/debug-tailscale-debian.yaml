name: Debian Trixie Debugging Workflow via Tailscale
on: [ workflow_dispatch ]   # Workflow is triggered manually

jobs:
  # #########################################################################
  # #### Debian Trixie Debugging Workflow via Tailscale                  ####
  # #########################################################################
  tailscale-debug-debian-trixie:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      # Grant required network privileges and inject the TUN device for Tailscale
      options: --cap-add=SYS_ADMIN --cap-add=NET_ADMIN --device /dev/net/tun
    steps:

      # ###### Prepare barebones Debian container ###########################
      - name: Prepare Debian Container
        run: |
          apt-get update
          # Added iptables and iproute2 for Tailscale networking
          apt-get install -y sudo curl git openssh-server iptables iproute2 locales-all

          # Create 'runner' user to match your script's expectations
          useradd -m -s /bin/bash runner
          echo "runner ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

          # Prepare SSH daemon directory (required when not using systemd)
          mkdir -p /run/sshd

      - uses: actions/checkout@v7

      # ###### Connect runner to your Tailnet ###############################
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: ${{ github.event.repository.name }}-debian

      # ###### Enable SSH daemon ############################################
      - name: Enable SSH
        shell: bash
        run: |
          # Fetch public SSH keys for the GitHub user who launched this workflow:
          echo "Fetching SSH public keys for GitHub user: ${{ github.actor }}..."
          mkdir -p /home/runner/.ssh
          curl -sL "https://github.com/${{ github.actor }}.keys" >> /home/runner/.ssh/authorized_keys
          chmod 700 /home/runner/.ssh
          chmod 600 /home/runner/.ssh/authorized_keys
          sudo chown -R runner:runner /home/runner/.ssh

          # Start the standard SSH service:
          sudo /usr/sbin/sshd

          echo "====== Access at $(date +"%Y-%m-%d %H:%M:%S %z") ================================"
          echo "Tailscale IPs: $(tailscale ip | xargs)"
          echo "Connect via SSH using:"
          echo " * ssh runner@$(tailscale ip -4)"
          echo " * ssh runner@$(tailscale ip -6)"
          echo "SSH key fingerprints:"
          keyNumber=1
          while IFS= read -r key ; do
            echo -n " * #${keyNumber}: "
            ssh-keygen -lf "${key}" | sed -e "s/^\([0-9]*\) \([^ ]*\) \(.*\) (\(.*\))$/\2 (\4 \1)/g"
            keyNumber=$((keyNumber+1))
          done < <(find /etc/ssh -maxdepth 1 -name "ssh_host_*.pub" -print | sort)
          echo "==========================================================================="

      # ###### Clone repositories ###########################################
      - name: Clone repositories
        shell: bash
        run: |
          sudo -u runner mkdir -p /home/runner/src && cd /home/runner/src
          sudo -u runner git clone https://dreibh@github.com/dreibh/bibtexconv
          sudo -u runner git clone https://dreibh@github.com/simula/dynmhs
          sudo -u runner git clone https://dreibh@github.com/dreibh/fractgen
          sudo -u runner git clone https://dreibh@github.com/dreibh/hipercontracer
          sudo -u runner git clone https://dreibh@github.com/dreibh/netperfmeter
          sudo -u runner git clone https://dreibh@github.com/dreibh/rserpooldemo
          sudo -u runner git clone https://dreibh@github.com/dreibh/rsplib
          sudo -u runner git clone https://dreibh@github.com/dreibh/rtpaudio
          sudo -u runner git clone https://dreibh@github.com/dreibh/sctplib
          sudo -u runner git clone https://dreibh@github.com/dreibh/slideshow
          sudo -u runner git clone https://dreibh@github.com/dreibh/socketapi
          sudo -u runner git clone https://dreibh@github.com/dreibh/subnetcalc
          sudo -u runner git clone https://dreibh@github.com/dreibh/system-tools
          sudo -u runner git clone https://dreibh@github.com/dreibh/tsctp
          sudo -u runner git clone https://dreibh@github.com/simula/nornet-vmimage-builder-scripts.git vmimage-builder-scripts

      # ###### Pre-install some Linux packages ##############################
      - name: Install custom packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt install -y bash-completion build-essential cmake figlet gettext git joe sudo

          sudo apt install -y libmaxminddb-dev

          sudo apt install -y libbz2-dev libsctp-dev ghostscript graphicsmagick pdf2svg

          sudo apt install -y bison flex libcurl4-openssl-dev libssl-dev

          sudo apt install -y libboost-all-dev liblzma-dev
          sudo apt install -y libmariadb-dev libpqxx-dev libmongoc-dev libbson-dev

          sudo apt install -y qt6-base-dev qt6-tools-dev

          sudo apt install -y gimp libimage-exiftool-perl fonts-noto

          sudo apt install -y gnutls-bin libnss3-tools

          sudo apt install -y autoconf automake libglib2.0-dev libtool

          sudo apt install -y libpulse-dev

          sudo apt install -y libssl-dev libjansson-dev libldns-dev libmnl-dev libuv1-dev

          sudo apt install -y libgraphicsmagick1-dev

          sudo apt install -y python3 python3-venv python3-distro python3-psutil

          sudo -u runner bash -c '
            python3 -m venv /home/runner/venv
            . /home/runner/venv/bin/activate
            pip install distro psutil
          '

      # ###### Install System-Tools and configure environment ###############
      - name: Install System-Tools and configure environment
        shell: bash
        run: |
          cd /home/runner/src/system-tools
          ./autogen.sh
          sudo make install

          sudo cp \
             /home/runner/src/vmimage-builder-scripts/files/11-system-info.files/01-hostname \
             /home/runner/src/vmimage-builder-scripts/files/80-simulamet.files/02-simulamet \
             /etc/system-info.d/

          # Load ~/.bashrc by default:
          sudo -u runner bash -c "cat >>/home/runner/.bash_profile <<'EOF'
          [ -f \$HOME/.bashrc ] && source \$HOME/.bashrc
          EOF"

          # Enable Bash shell completions:
          sudo -u runner bash -c "cat >>/home/runner/.bashrc <<'EOF'
          [[ -r \"/usr/share/bash-completion/bash_completion\" ]] && . \"/usr/share/bash-completion/bash_completion\"
          EOF"
          sudo -u runner bash -c "cat /home/runner/src/vmimage-builder-scripts/files/05-user-settings.files/bashrc >>/home/runner/.bashrc"

          # Set a useful hostname:
          sudo Reset-Machine-ID --yes-to-all-i-am-really-sure -MSK -H "debian.github.test" || true

      # ###### Pause the runner for interactive SSH debugging ###############
      - name: Wait for interactive debugging
        shell: bash
        run: |
          while true ; do
             echo "====== Access at $(date +"%Y-%m-%d %H:%M:%S %z") ================================"
             echo "Tailscale IPs: $(tailscale ip | xargs)"
             echo "Connect via SSH using:"
             echo " * ssh runner@$(tailscale ip -4)"
             echo " * ssh runner@$(tailscale ip -6)"
             echo "SSH key fingerprints:"
             keyNumber=1
             while IFS= read -r key ; do
               echo -n " * #${keyNumber}: "
               ssh-keygen -lf "${key}" | sed -e "s/^\([0-9]*\) \([^ ]*\) \(.*\) (\(.*\))$/\2 (\4 \1)/g"
               keyNumber=$((keyNumber+1))
             done < <(find /etc/ssh -maxdepth 1 -name "ssh_host_*.pub" -print | sort)
             echo "==========================================================================="
             sleep 300
          done
