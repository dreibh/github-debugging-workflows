name: MacOS Debugging Workflow via Tailscale
on: [ workflow_dispatch ]   # Workflow is triggered manually

jobs:
  # #########################################################################
  # #### MacOS Debugging Workflow via Tailscale                          ####
  # #########################################################################
  tailscale-debug-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # ###### Connect runner to your Tailnet ###############################
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # # ###### Enable Tailscale SSH daemon ##################################
      # - name: Enable Tailscale SSH
      #   run: |
      #     sudo tailscale set --ssh
      #
      #     echo "====== $(date +"%Y-%m-%d %H:%M:%S %z") =========================================="
      #     echo "Tailscale IPs: $(tailscale ip | xargs)"
      #     echo "Connect via SSH using:"
      #     echo " * ssh runner@$(tailscale ip -4)"
      #     echo " * ssh runner@$(tailscale ip -6)"
      #     echo "SSH key fingerprints:"
      #     keyNumber=1
      #     while IFS= read -r key ; do
      #       echo -n " * #${keyNumber}: "
      #       ssh-keygen -lf "${key}" | sed -e "s/^\([0-9]*\) \([^ ]*\) \(.*\) (\(.*\))$/\2 (\4 \1)/g"
      #       keyNumber=$((keyNumber+1))
      #     done < <(find /etc/ssh -maxdepth 1 -name "ssh_host_*.pub" -print | sort)
      #     echo "==========================================================================="

      # ###### Enable Standard SSH daemon ##################################
      - name: Enable Standard SSH
        run: |
          # Fetch public SSH keys for the GitHub user who launched this workflow:
          echo "Fetching SSH public keys for GitHub user: ${{ github.actor }}..."
          mkdir -p /Users/runner/.ssh
          curl -sL "https://github.com/${{ github.actor }}.keys" >> /Users/runner/.ssh/authorized_keys
          chmod 700 /Users/runner/.ssh
          chmod 600 /Users/runner/.ssh/authorized_keys
          sudo chown -R runner:staff /Users/runner/.ssh

          # Start the standard SSH service (macOS Remote Login)
          sudo systemsetup -f -setremotelogin on

          echo "====== $(date +"%Y-%m-%d %H:%M:%S %z") =========================================="
          echo "Tailscale IPs: $(tailscale ip | xargs)"
          echo "Connect via SSH using:"
          echo " * ssh runner@$(tailscale ip -4)"
          echo " * ssh runner@$(tailscale ip -6)"
          echo "SSH key fingerprints:"
          keyNumber=1
          while IFS= read -r key ; do
            echo -n " * #${keyNumber}: "
            ssh-keygen -lf "${key}" | sed -e "s/^\([0-9]*\) \([^ ]*\) \(.*\) (\(.*\))$/\2 (\4 \1)/g"
            keyNumber=$((keyNumber+1))
          done < <(find /etc/ssh -maxdepth 1 -name "ssh_host_*.pub" -print | sort)
          echo "==========================================================================="

      # ###### Clone repositories ###########################################
      - name: Clone repositories
        run: |
          mkdir -p ~/src && cd ~/src
          git clone https://dreibh@github.com/dreibh/bibtexconv
          git clone https://dreibh@github.com/simula/dynmhs
          git clone https://dreibh@github.com/dreibh/fractgen
          git clone https://dreibh@github.com/dreibh/hipercontracer
          git clone https://dreibh@github.com/dreibh/netperfmeter
          git clone https://dreibh@github.com/dreibh/rserpooldemo
          git clone https://dreibh@github.com/dreibh/rsplib
          git clone https://dreibh@github.com/dreibh/rtpaudio
          git clone https://dreibh@github.com/dreibh/sctplib
          git clone https://dreibh@github.com/dreibh/slideshow
          git clone https://dreibh@github.com/dreibh/socketapi
          git clone https://dreibh@github.com/dreibh/subnetcalc
          git clone https://dreibh@github.com/dreibh/system-tools
          git clone https://dreibh@github.com/dreibh/tsctp
          git clone https://dreibh@github.com/simula/nornet-vmimage-builder-scripts.git vmimage-builder-scripts

      # ###### Pre-install some Homebrew packages ###########################
      - name: Install custom packages
        run: |
          brew install -y bash bash-completion@2 cmake figlet gnu-getopt gettext git htop joe make pwgen wget


          brew install -y libidn2 libmaxminddb

          brew install ghostscript graphicsmagick pdf2svg

          brew install -y bison && brew link --force bison

          brew install -y boost
          brew install -y mariadb-connector-c libpqxx mongo-c-driver

          brew install -y qt

          brew install -y exiftool gimp
          brew install -y --cask font-noto-sans
          brew install -y --cask font-noto-serif
          brew install -y --cask font-noto-sans-mono
          brew install -y --cask font-noto-emoji
          brew install -y --cask font-noto-sans-cjk
          brew install -y --cask font-noto-serif-cjk
          brew install -y --cask font-noto-nerd-font

          brew install -y gnutls nss

          brew install -y autoconf automake glib libtool

          brew install pulseaudio

          brew install openssl jansson ldns libuv

          brew install -y python3
          pip install distro psutil

          python3 -m venv ~/venv
          . ~/venv/bin/activate
          pip install distro psutil

      # ###### Install System-Tools and configure environment ###############
      - name: Install System-Tools and configure environment
        run: |
          cd ~/src/system-tools
          ./autogen.sh
          sudo make install

          sudo cp \
             ~/src/vmimage-builder-scripts/files/11-system-info.files/01-hostname \
             ~/src/vmimage-builder-scripts/files/80-simulamet.files/02-simulamet \
             /usr/local/etc/system-info.d/

          # Set shell to modern Bash-5.x:
          BREW_BASH="$(brew --prefix)/bin/bash"
          if ! grep -qF "$BREW_BASH" /etc/shells; then
             echo "$BREW_BASH" | sudo tee -a /etc/shells
          fi
          sudo dscl . -create /Users/runner UserShell "$BREW_BASH"

          # Process scripts in /opt/homebrew/etc/profile.d/:
          # This also includes Bash completion initialisation!
          cat >>~/.bashrc <<'EOF'

          # ====== Source files in custom */etc/profile.d/ ============================
          for profileFile in /usr/local/etc/profile.d/*.sh /opt/homebrew/etc/profile.d/*.sh ; do
             [ -r "$profileFile" ] && . "$profileFile"
          done

          # ===========================================================================
          EOF
          cat ~/src/vmimage-builder-scripts/files/05-user-settings.files/bashrc >>~/.bashrc

          # Set a useful hostname:
          sudo Reset-Machine-ID --yes-to-all-i-am-really-sure -MSK -H "apple.github.test"

          # Enable "locate" database:
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.locate.plist

      # ###### Pause the runner for interactive SSH debugging ###############
      - name: Wait for SSH debugging
        run: |
          caffeinate -s -i -u bash -c '
            while true ; do
              echo "====== $(date +"%Y-%m-%d %H:%M:%S %z") =========================================="
              echo "Tailscale IPs: $(tailscale ip | xargs)"
              echo "Connect via SSH using:"
              echo " * ssh runner@$(tailscale ip -4)"
              echo " * ssh runner@$(tailscale ip -6)"
              echo "SSH key fingerprints:"
              keyNumber=1
              while IFS= read -r key ; do
                echo -n " * #${keyNumber}: "
                ssh-keygen -lf "${key}" | sed -e "s/^\([0-9]*\) \([^ ]*\) \(.*\) (\(.*\))$/\2 (\4 \1)/g"
                keyNumber=$((keyNumber+1))
              done < <(find /etc/ssh -maxdepth 1 -name "ssh_host_*.pub" -print | sort)
              echo "==========================================================================="
              sleep 300
            done
          '
