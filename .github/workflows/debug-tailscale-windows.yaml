name: Windows Debugging Workflow via Tailscale
on: [ workflow_dispatch ]   # Workflow is triggered manually

jobs:
  # #########################################################################
  # #### Windows Debugging Workflow via Tailscale                        ####
  # #########################################################################
  tailscale-debug-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash   # Use Git Bash for command execution

    steps:
      - uses: actions/checkout@v7

      # ###### Connect runner to your Tailnet ###############################
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # ###### Enable Tailscale SSH daemon ##################################
      - name: Enable Windows OpenSSH Server
        shell: powershell
        run: |
          # Ensure OpenSSH.Server capability is installed and running:
          Get-WindowsCapability -Online | Where-Object Name -like 'OpenSSH.Server*' | Add-WindowsCapability -Online -ErrorAction SilentlyContinue
          Set-Service -Name sshd -StartupType Automatic
          Start-Service -Name sshd

          # Fetch public SSH keys for the GitHub user who launched this workflow:
          $githubUser = "${{ github.actor }}"
          Write-Host "Fetching SSH public keys for GitHub user: $githubUser..."
          $pubKeys = Invoke-RestMethod -Uri "https://github.com/$githubUser.keys"

          # Write keys to the Windows OpenSSH Administrators authorized keys file:
          $authKeysPath = "$env:ProgramData\ssh\administrators_authorized_keys"
          $pubKeys | Out-File -FilePath $authKeysPath -Encoding ascii
          icacls.exe $authKeysPath /inheritance:r /grant "Administrators:F" /grant "SYSTEM:F"

          # Set a password for runneradmin to allow SSH authentication:
          $password = ConvertTo-SecureString "DebugPassword123!" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $password

          # Set shell to Bash:
          New-ItemProperty -Path "HKLM:\SOFTWARE\OpenSSH" `
             -Name "DefaultShell" `
             -Value "C:\Program Files\Git\bin\bash.exe" `
             -PropertyType String `
             -Force

          $now = Get-Date -Format "yyyy-MM-dd HH:mm:ss zzz"
          Write-Host "====== $now =========================================="
          Write-Host "Tailscale IPs: $(tailscale ip)"
          Write-Host "Connect via SSH using:"
          Write-Host " * ssh runneradmin@$(tailscale ip -4)"
          Write-Host "Password: DebugPassword123!"
          Write-Host "SSH key fingerprints:"
          $keyNumber = 1
          Get-ChildItem "$env:ProgramData\ssh\ssh_host_*.pub" | Sort-Object Name | ForEach-Object {
             $fp = ssh-keygen -lf $_.FullName
             if ($fp -match '^(\d+)\s+(\S+)\s+.*?\((.+)\)$') {
                $fp = "$($Matches[2]) ($($Matches[3]) $($Matches[1]))"
             }
             Write-Host " * #${keyNumber}: $fp"
             $keyNumber++
          }
          Write-Host "==========================================================="

      # ###### Install Joe editor ###########################################
      - name: Install Joe editor
        run: |
          /c/msys64/usr/bin/pacman -Sy --noconfirm joe
          ln -sf /c/msys64/usr/bin/joe.exe /usr/bin/joe

      # ###### Clone repositories ###########################################
      - name: Clone repositories
        run: |
          mkdir -p ~/src && cd ~/src
          git clone https://dreibh@github.com/dreibh/bibtexconv
          # git clone https://dreibh@github.com/simula/dynmhs
          git clone https://dreibh@github.com/dreibh/fractgen
          # git clone https://dreibh@github.com/dreibh/hipercontracer
          # git clone https://dreibh@github.com/dreibh/netperfmeter
          # git clone https://dreibh@github.com/dreibh/rserpooldemo
          # git clone https://dreibh@github.com/dreibh/rsplib
          # git clone https://dreibh@github.com/dreibh/rtpaudio
          # git clone https://dreibh@github.com/dreibh/sctplib
          # git clone https://dreibh@github.com/dreibh/slideshow
          # git clone https://dreibh@github.com/dreibh/socketapi
          git clone https://dreibh@github.com/dreibh/subnetcalc
          git clone https://dreibh@github.com/dreibh/system-tools
          # git clone https://dreibh@github.com/dreibh/tsctp
          git clone https://dreibh@github.com/simula/nornet-vmimage-builder-scripts.git vmimage-builder-scripts

      # ###### Cache dependencies ###########################################
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            C:/vcpkg/installed
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('.github/workflows/debug-tailscale-windows.yaml') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      # ###### Pre-install some Windows packages ############################
      # Some Windows CLI applications (Scoop) and C/C++ Libraries (vcpkg)
      - name: Install custom packages
        shell: powershell
        run: |
          # Install Scoop for standalone applications and CLI utilities:
          & ([scriptblock]::Create((Invoke-RestMethod -Uri https://get.scoop.sh))) -RunAsAdmin
          scoop bucket add extras
          scoop install cmake make wget figlet gettext
          # exiftool ghostscript graphicsmagick pdf2svg gimp

          # Add missing shims for gettext and ngettext runtime executables:
          scoop shim add gettext "$env:USERPROFILE\scoop\apps\gettext\current\bin\gettext.exe"
          scoop shim add ngettext "$env:USERPROFILE\scoop\apps\gettext\current\bin\ngettext.exe"

          # Add Scoop shims to PATH for all subsequent workflow steps
          echo "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # 2. Install C/C++ libraries using runner pre-installed vcpkg:
          $packages = @(
             "getopt:x64-windows",
             "gettext[core,tools]:x64-windows",
             "libidn2:x64-windows",
             "libmaxminddb:x64-windows"
          )
          vcpkg install $packages

          # 3. Install Python dependencies:
          python -m pip install --upgrade pip
          pip install distro psutil

          python -m venv "$env:USERPROFILE\venv"
          & "$env:USERPROFILE\venv\Scripts\Activate.ps1"
          pip install distro psutil

      # ###### Install System-Tools and configure environment ###############
      - name: Configure environment
        run: |
          mkdir -p /c/usr/local/etc/system-info.d/
          cp \
             ~/src/vmimage-builder-scripts/files/11-system-info.files/01-hostname \
             ~/src/vmimage-builder-scripts/files/80-simulamet.files/02-simulamet \
             /c/usr/local/etc/system-info.d/ || true

          # Apply Bash configuration settings:
          cat ~/src/vmimage-builder-scripts/files/05-user-settings.files/bashrc >>~/.bashrc || true

      # ###### Pause the runner for interactive SSH debugging ###############
      - name: Wait for SSH debugging
        run: |
          while true ; do
             echo "====== $(date +"%Y-%m-%d %H:%M:%S %z") =========================================="
             echo "Tailscale IPs: $(tailscale ip | xargs)"
             echo "Connect via SSH using:"
             echo " * ssh runneradmin@$(tailscale ip -4)"
             echo "Password: DebugPassword123!"
             echo "SSH key fingerprints:"
             keyNumber=1
             while IFS= read -r key ; do
               echo -n " * #${keyNumber}: "
               ssh-keygen -lf "${key}" | sed -e "s/^\([0-9]*\) \([^ ]*\) \(.*\) (\(.*\))$/\2 (\4 \1)/g"
               keyNumber=$((keyNumber+1))
             done < <(find /c/ProgramData/ssh -maxdepth 1 -name "ssh_host_*.pub" -print | sort)
             echo "==========================================================================="
             sleep 60
          done
