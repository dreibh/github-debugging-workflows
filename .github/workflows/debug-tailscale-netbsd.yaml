name: NetBSD Debugging Workflow via Tailscale
on: [ workflow_dispatch ]   # Workflow is triggered manually

jobs:
  # #########################################################################
  # #### NetBSD Debugging Workflow via Tailscale                         ####
  # #########################################################################
  tailscale-debug-netbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ###### Start NetBSD VM and Execute Debug Environment ################
      - name: Start NetBSD VM and Execute Debug Environment
        uses: vmactions/netbsd-vm@v1
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          GITHUB_ACTOR: ${{ github.actor }}
          REPO_NAME: ${{ github.event.repository.name }}
        with:
          release: "11.0"
          envs: "TAILSCALE_AUTHKEY GITHUB_ACTOR REPO_NAME"
          prepare: |
            export PATH="/usr/pkg/bin:/usr/pkg/sbin:/sbin:/usr/sbin:$PATH"
            if ! command -v pkgin >/dev/null 2>&1; then
               /usr/sbin/pkg_add pkgin
            fi

            pkgsrcURL="https://cdn.netbsd.org/pub/pkgsrc/packages/NetBSD"
            arch="$(uname -p)"
            release="$(uname -r | cut -d_ -f1)_2026Q2"
            sed -e 's,^[^#].*$,'"$pkgsrcURL"'/$arch/'"$release"'/All,' \
               /usr/pkg/etc/pkgin/repositories.conf >/tmp/repositories.conf
            mv /tmp/repositories.conf /usr/pkg/etc/pkgin/repositories.conf

            pkgin -y update
            pkgin -y install bash curl git sudo tailscale openssh mozilla-rootcerts

          run: |
            set -eu
            export PATH="/usr/pkg/bin:/usr/pkg/sbin:/sbin:/usr/sbin:$PATH"

            # 1. Copy rc.d script, enable and start tailscaled:
            if [ -f /usr/pkg/share/examples/rc.d/tailscaled ]; then
               cp /usr/pkg/share/examples/rc.d/tailscaled /etc/rc.d/tailscaled
               chmod 755 /etc/rc.d/tailscaled
            fi
            echo 'tailscaled=YES' >> /etc/rc.conf
            service tailscaled start || /usr/pkg/sbin/tailscaled &
            sleep 3

            TS_HOSTNAME="${REPO_NAME}-netbsd"
            tailscale up --authkey="${TAILSCALE_AUTHKEY}" --hostname="${TS_HOSTNAME}"

            # 2. Create 'runner' user:
            if ! user show runner >/dev/null 2>&1; then
               if [ -d /home/runner ]; then
                  useradd -s /usr/pkg/bin/bash -g wheel runner
               else
                  useradd -m -s /usr/pkg/bin/bash -g wheel runner
               fi
               echo "runner ALL=(ALL) NOPASSWD:ALL" >> /usr/pkg/etc/sudoers
            fi

            # 3. Setup SSH keys for the GitHub user:
            echo "Fetching SSH public keys for GitHub user: ${GITHUB_ACTOR}..."
            mkdir -p /home/runner/.ssh
            curl -sL "https://github.com/${GITHUB_ACTOR}.keys" >> /home/runner/.ssh/authorized_keys
            chmod 700 /home/runner/.ssh
            chmod 600 /home/runner/.ssh/authorized_keys
            chown -R runner:wheel /home/runner

            # 4. Enable and start SSH service:
            echo 'sshd=YES' >> /etc/rc.conf
            service sshd restart || /usr/sbin/sshd
            echo "====== Access at $(date +"%Y-%m-%d %H:%M:%S %z") ================================"
            echo "Tailscale IPs: $(tailscale ip | xargs)"
            echo "Connect via SSH using:"
            echo " * ssh runner@$(tailscale ip -4)"
            echo " * ssh runner@$(tailscale ip -6)"
            echo "SSH key fingerprints:"
            keyNumber=1
            for key in $(find /etc/ssh /usr/pkg/etc/ssh -maxdepth 1 -name "ssh_host_*.pub" 2>/dev/null | sort) ; do
              echo -n " * #${keyNumber}: "
              ssh-keygen -lf "${key}" | sed -e "s/^\([0-9]*\) \([^ ]*\) \(.*\) (\(.*\))$/\2 (\4 \1)/g"
              keyNumber=$((keyNumber+1))
            done
            echo "==========================================================================="

            # 5. Clone repositories
            mkdir -p /home/runner/src
            chown -R runner:wheel /home/runner/src
            cd /home/runner/src
            sudo -u runner git clone https://dreibh@github.com/dreibh/bibtexconv
            sudo -u runner git clone https://dreibh@github.com/simula/dynmhs
            sudo -u runner git clone https://dreibh@github.com/dreibh/fractgen
            sudo -u runner git clone https://dreibh@github.com/dreibh/hipercontracer
            sudo -u runner git clone https://dreibh@github.com/dreibh/netperfmeter
            sudo -u runner git clone https://dreibh@github.com/dreibh/rserpooldemo
            sudo -u runner git clone https://dreibh@github.com/dreibh/rsplib
            sudo -u runner git clone https://dreibh@github.com/dreibh/rtpaudio
            sudo -u runner git clone https://dreibh@github.com/dreibh/sctplib
            sudo -u runner git clone https://dreibh@github.com/dreibh/slideshow
            sudo -u runner git clone https://dreibh@github.com/dreibh/socketapi
            sudo -u runner git clone https://dreibh@github.com/dreibh/subnetcalc
            sudo -u runner git clone https://dreibh@github.com/dreibh/system-tools
            sudo -u runner git clone https://dreibh@github.com/dreibh/tsctp
            sudo -u runner git clone https://dreibh@github.com/simula/nornet-vmimage-builder-scripts.git vmimage-builder-scripts

            # 6. Install System-Tools & Environment Settings:
            pkgin -y install bash cmake figlet gcc15 getopt gettext git gmake joe sudo wget
            cd /home/runner/src/system-tools
            sudo -u runner ./autogen.sh
            make install

            mkdir -p /usr/pkg/etc/system-info.d/
            cp /home/runner/src/vmimage-builder-scripts/files/11-system-info.files/01-hostname \
               /home/runner/src/vmimage-builder-scripts/files/80-simulamet.files/02-simulamet \
               /usr/pkg/etc/system-info.d/ || true

            sudo -u runner bash -c "cat >>/home/runner/.bash_profile <<'INNER_EOF'
            [ -f \$HOME/.bashrc ] && source \$HOME/.bashrc
            INNER_EOF"

            sudo -u runner bash -c "cat >>/home/runner/.bashrc <<'INNER_EOF'
            [[ -r \"/usr/pkg/share/bash-completion/bash_completion\" ]] && . \"/usr/pkg/share/bash-completion/bash_completion\"
            INNER_EOF"
            sudo -u runner bash -c "cat /home/runner/src/vmimage-builder-scripts/files/05-user-settings.files/bashrc >>/home/runner/.bashrc"

            cat >>/etc/profile <<'EOF'
            export LANG="C.UTF-8"
            export LC_CTYPE="C.UTF-8"
            for dir in /etc/profile.d /usr/local/etc/profile.d /usr/pkg/etc/profile.d ; do
                if [ -d "$dir" ]; then
                    for script in "$dir"/*.sh; do
                        # The [ -r ... ] check ensures non-matching wildcards are not sourced:
                        [ -r "$script" ] && . "$script"
                    done
                fi
            done
            EOF

            # 7. Set a useful hostname:
            Reset-Machine-ID --yes-to-all-i-am-really-sure -MSK -H "netbsd.github.test" || true

            # 8. Pre-install NetBSD packages via pkgin:
            pkgin -y install libidn2 libiberty libmaxminddb

            # pkgin -y install ghostscript GraphicsMagick pdf2svg

            pkgin -y install bison flex curl openssl

            pkgin -y install libinotify boost
            pkgin -y install mariadb-client libpqxx mongo-c-driver

            # pkgin -y install qt6

            # pkgin -y install gimp p5-Image-ExifTool

            pkgin -y install gnutls nss

            pkgin -y install autoconf automake glib2 libtool pkgconf

            # pkgin -y install pulseaudio

            pkgin -y install openssl jansson ldns libuv

            pkgin -y install python314

            sudo -u runner bash -c '
              python3.14 -m venv /home/runner/venv
              . /home/runner/venv/bin/activate
              pip install distro psutil
            '

            # 9. Pause and keep alive for interactive SSH debugging:
            while true ; do
               echo "====== Access at $(date +"%Y-%m-%d %H:%M:%S %z") ================================"
               echo "Tailscale IPs: $(tailscale ip | xargs)"
               echo "Connect via SSH using:"
               echo " * ssh runner@$(tailscale ip -4)"
               echo " * ssh runner@$(tailscale ip -6)"
               echo "SSH key fingerprints:"
               keyNumber=1
               for key in $(find /etc/ssh /usr/pkg/etc/ssh -maxdepth 1 -name "ssh_host_*.pub" 2>/dev/null | sort) ; do
                 echo -n " * #${keyNumber}: "
                 ssh-keygen -lf "${key}" | sed -e "s/^\([0-9]*\) \([^ ]*\) \(.*\) (\(.*\))$/\2 (\4 \1)/g"
                 keyNumber=$((keyNumber+1))
               done
               echo "==========================================================================="
               sleep 300
            done
