name: NetBSD 11.0 Debugging Workflow via Tailscale
on: [ workflow_dispatch ]   # Workflow is triggered manually

jobs:
  # #########################################################################
  # #### NetBSD Debugging Workflow via Tailscale                         ####
  # #########################################################################
  tailscale-debug-netbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ###### Boot NetBSD 11.0 VM & Execute Debug Environment ##############
      - name: Start NetBSD 11.0 VM & Debugging Environment
        uses: vmactions/netbsd-vm@v1
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          GITHUB_ACTOR: ${{ github.actor }}
          REPO_NAME: ${{ github.event.repository.name }}
        with:
          release: "11.0"
          envs: "TAILSCALE_AUTHKEY GITHUB_ACTOR REPO_NAME"
          prepare: |
            export PATH="/usr/pkg/bin:/usr/pkg/sbin:/sbin:/usr/sbin:$PATH"
            if ! command -v pkgin >/dev/null 2>&1; then
               /usr/sbin/pkg_add pkgin
            fi
            pkgin -y update
            pkgin -y install bash curl git sudo tailscale openssh mozilla-rootcerts

          run: |
            set -eu

            # 1. Copy rc.d script, enable and start tailscaled
            if [ -f /usr/pkg/share/examples/rc.d/tailscaled ]; then
               cp /usr/pkg/share/examples/rc.d/tailscaled /etc/rc.d/tailscaled
               chmod 755 /etc/rc.d/tailscaled
            fi
            echo 'tailscaled=YES' >> /etc/rc.conf
            service tailscaled start || /usr/pkg/sbin/tailscaled &
            sleep 3

            TS_HOSTNAME="${REPO_NAME}-netbsd"
            tailscale up --authkey="${TAILSCALE_AUTHKEY}" --hostname="${TS_HOSTNAME}"

            # 3. Setup SSH keys for the GitHub user
            echo "Fetching SSH public keys for GitHub user: ${GITHUB_ACTOR}..."
            mkdir -p /home/runner/.ssh
            curl -sL "https://github.com/${GITHUB_ACTOR}.keys" >> /home/runner/.ssh/authorized_keys
            chmod 700 /home/runner/.ssh
            chmod 600 /home/runner/.ssh/authorized_keys
            chown -R runner:wheel /home/runner

            # 4. Enable and start SSH service
            echo 'sshd=YES' >> /etc/rc.conf
            service sshd restart || /usr/sbin/sshd
            echo "====== Access at $(date +"%Y-%m-%d %H:%M:%S %z") ================================"
            echo "Tailscale IPs: $(tailscale ip | xargs)"
            echo "Connect via SSH using:"
            echo " * ssh runner@$(tailscale ip -4)"
            echo " * ssh runner@$(tailscale ip -6)"
            echo "SSH key fingerprints:"
            keyNumber=1
            for key in $(find /etc/ssh /usr/pkg/etc/ssh -maxdepth 1 -name "ssh_host_*.pub" 2>/dev/null | sort) ; do
              echo -n " * #${keyNumber}: "
              ssh-keygen -lf "${key}" | sed -e "s/^\([0-9]*\) \([^ ]*\) \(.*\) (\(.*\))$/\2 (\4 \1)/g"
              keyNumber=$((keyNumber+1))
            done
            echo "==========================================================================="

            # 5. Clone repositories
            mkdir -p /home/runner/src
            chown -R runner:wheel /home/runner
